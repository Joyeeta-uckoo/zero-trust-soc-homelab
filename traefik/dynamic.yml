
tls:
  certificates:
    - certFile: /etc/traefik/certs/soc-lab.crt
      keyFile: /etc/traefik/certs/soc-lab.key

http:
  middlewares:
    authelia:
      forwardAuth:
        address: "http://authelia:9091/api/authz/forward-auth"
        trustForwardHeader: true
        authResponseHeaders:
          - "Remote-User"
          - "Remote-Groups"
          - "Remote-Email"
          - "Remote-Name"
